<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SGS — Detalhamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0f1117;
            --surface:   #181c27;
            --border:    #252a38;
            --accent:    #4f8ef7;
            --accent-dim:#1e3560;
            --text:      #e2e8f0;
            --muted:     #64748b;
            --success:   #22c55e;
            --danger:    #ef4444;
            --warning:   #f59e0b;
            --info:      #38bdf8;
            --purple:    #a78bfa;
            --radius:    8px;
            --mono:      'DM Mono', monospace;
            --sans:      'DM Sans', sans-serif;
        }

        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-family: var(--mono); font-size: .85rem; letter-spacing: .08em; color: var(--accent); }
        .logo span { color: var(--muted); }
        .btn-back {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: .4rem .9rem;
            border-radius: var(--radius);
            font-size: .82rem;
            cursor: pointer;
            text-decoration: none;
            transition: all .15s;
        }
        .btn-back:hover { color: var(--text); border-color: var(--muted); }

        main { max-width: 720px; margin: 3rem auto; padding: 0 1.5rem; }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .page-header h1 { font-size: 1.35rem; font-weight: 600; }
        .page-header .id-tag {
            font-family: var(--mono);
            font-size: .8rem;
            color: var(--muted);
            margin-top: .25rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            font-family: var(--mono);
            font-size: .75rem;
            font-weight: 500;
            padding: .35rem .8rem;
            border-radius: 6px;
            letter-spacing: .04em;
            white-space: nowrap;
        }
        .badge::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; }

        .badge-SOLICITADO  { background: rgba(56,189,248,.12); color: var(--info);    border: 1px solid rgba(56,189,248,.3); }
        .badge-SOLICITADO::before  { background: var(--info); }
        .badge-LIBERADO    { background: rgba(167,139,250,.12); color: var(--purple);  border: 1px solid rgba(167,139,250,.3); }
        .badge-LIBERADO::before    { background: var(--purple); }
        .badge-APROVADO    { background: rgba(34,197,94,.12);  color: var(--success); border: 1px solid rgba(34,197,94,.3); }
        .badge-APROVADO::before    { background: var(--success); }
        .badge-REJEITADO   { background: rgba(239,68,68,.12);  color: var(--danger);  border: 1px solid rgba(239,68,68,.3); }
        .badge-REJEITADO::before   { background: var(--danger); }
        .badge-CANCELADO   { background: rgba(100,116,139,.12);color: var(--muted);   border: 1px solid rgba(100,116,139,.3); }
        .badge-CANCELADO::before   { background: var(--muted); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1.2rem;
            overflow: hidden;
        }
        .card-title {
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: var(--muted);
            padding: .85rem 1.4rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }
        .card-body { padding: 1.4rem; }

        .fields-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.4rem;
        }
        .fields-grid.single { grid-template-columns: 1fr; }

        .field-item {}
        .field-item .label {
            font-size: .7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--muted);
            margin-bottom: .3rem;
        }
        .field-item .value {
            font-size: .92rem;
            color: var(--text);
            line-height: 1.5;
        }
        .field-item .value.mono {
            font-family: var(--mono);
            font-size: .85rem;
            color: var(--muted);
        }
        .field-item .value.valor-destaque {
            font-family: var(--mono);
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--success);
        }
        .field-item .value.descricao-text {
            font-size: .88rem;
            line-height: 1.7;
            color: #94a3b8;
        }

        .flow {
            display: flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
            padding: 1.2rem 1.4rem;
        }
        .flow-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .3rem;
        }
        .flow-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            color: var(--muted);
            font-family: var(--mono);
            transition: all .2s;
        }
        .flow-dot.done  { border-color: var(--success); background: rgba(34,197,94,.15); color: var(--success); }
        .flow-dot.current { border-color: var(--accent); background: rgba(79,142,247,.15); color: var(--accent); box-shadow: 0 0 0 3px rgba(79,142,247,.15); }
        .flow-dot.rejected { border-color: var(--danger); background: rgba(239,68,68,.15); color: var(--danger); }
        .flow-dot.cancelled { border-color: var(--muted); background: rgba(100,116,139,.1); color: var(--muted); }

        .flow-label {
            font-size: .65rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
        }
        .flow-label.active { color: var(--text); }

        .flow-line {
            flex: 1;
            height: 2px;
            background: var(--border);
            min-width: 24px;
            margin-bottom: 1.1rem;
        }
        .flow-line.done { background: var(--success); }

        .status-action {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: 1.2rem 1.4rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .status-action label {
            font-size: .75rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        .status-select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--sans);
            font-size: .85rem;
            padding: .42rem .75rem;
            border-radius: var(--radius);
            outline: none;
            flex: 1;
            min-width: 160px;
        }
        .btn-atualizar {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: .45rem 1.1rem;
            border-radius: var(--radius);
            font-family: var(--sans);
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s;
        }
        .btn-atualizar:hover { opacity: .85; }

        .estado-final {
            font-size: .82rem;
            color: var(--muted);
            font-style: italic;
        }

        #toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: .8rem 1.2rem;
            font-size: .85rem;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0,0,0,.4);
            transform: translateY(120%);
            transition: transform .25s ease;
            z-index: 999;
            max-width: 320px;
        }
        #toast.show { transform: translateY(0); }
        #toast.ok   { border-left: 3px solid var(--success); }
        #toast.err  { border-left: 3px solid var(--danger); }
    </style>
</head>
<body>

<header>
    <div class="logo">SGS <span>/ detalhamento</span></div>
    <a href="/" class="btn-back">← Voltar</a>
</header>

<main>
    <div class="page-header">
        <div>
            <h1>Detalhes da Solicitação</h1>
            <div class="id-tag" th:text="'#' + ${solicitacao.id}"></div>
        </div>
        <span class="badge" th:classappend="'badge-' + ${solicitacao.status}" th:text="${solicitacao.status}"></span>
    </div>

    <div class="card">
        <div class="card-title">Identificação</div>
        <div class="card-body">
            <div class="fields-grid">
                <div class="field-item">
                    <div class="label">Solicitante</div>
                    <div class="value" th:text="${solicitacao.nomeSolicitante}"></div>
                </div>
                <div class="field-item">
                    <div class="label">CPF / CNPJ</div>
                    <div class="value mono" th:text="${solicitacao.cpfCnpjSolicitante}"></div>
                </div>
                <div class="field-item">
                    <div class="label">Categoria</div>
                    <div class="value" th:text="${solicitacao.nomeCategoria}"></div>
                </div>
                <div class="field-item">
                    <div class="label">Data da Solicitação</div>
                    <div class="value mono"
                         th:text="${#temporals.format(solicitacao.dataSolicitacao, 'dd/MM/yyyy HH:mm')}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Dados do Pagamento</div>
        <div class="card-body">
            <div class="fields-grid">
                <div class="field-item">
                    <div class="label">Valor Solicitado</div>
                    <div class="value valor-destaque"
                         th:text="${#numbers.formatDecimal(solicitacao.valor, 1, 'POINT', 2, 'COMMA')}"></div>
                </div>
            </div>
            <div class="field-item" style="margin-top:1.2rem">
                <div class="label">Descrição</div>
                <div class="value descricao-text" th:text="${solicitacao.descricao}"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Fluxo de Status</div>

        <div class="flow" id="flow-container">
        </div>

        <div class="status-action" id="status-action-area"
             th:if="${solicitacao.status != 'REJEITADO' and solicitacao.status != 'CANCELADO'}">
            <label>Alterar para:</label>
            <select class="status-select" id="novoStatus">
            </select>
            <button class="btn-atualizar"
                    th:onclick="'atualizarStatus(' + ${solicitacao.id} + ')'">
                Atualizar Status
            </button>
        </div>

        <div class="status-action"
             th:if="${solicitacao.status == 'REJEITADO' or solicitacao.status == 'CANCELADO'}">
            <span class="estado-final">Esta solicitação está em estado final e não pode ser alterada.</span>
        </div>
    </div>
</main>

<div id="toast"></div>

<script th:inline="javascript">
    const statusAtual = /*[[${solicitacao.status}]]*/ 'SOLICITADO';
    const solicitacaoId = /*[[${solicitacao.id}]]*/ 0;

    const FLUXO_PRINCIPAL = ['SOLICITADO', 'LIBERADO', 'APROVADO'];
    const LABELS = {
        SOLICITADO: 'Solicitado',
        LIBERADO:   'Liberado',
        APROVADO:   'Aprovado',
        REJEITADO:  'Rejeitado',
        CANCELADO:  'Cancelado'
    };

    const TRANSICOES = {
        SOLICITADO: ['LIBERADO', 'REJEITADO'],
        LIBERADO:   ['APROVADO', 'REJEITADO'],
        APROVADO:   ['CANCELADO'],
        REJEITADO:  [],
        CANCELADO:  []
    };

    //Renderiza fluxo visual
    function renderFluxo() {
        const container = document.getElementById('flow-container');
        if (!container) return;

        const isRejeitado = statusAtual === 'REJEITADO';
        const isCancelado = statusAtual === 'CANCELADO';
        const idxAtual    = FLUXO_PRINCIPAL.indexOf(statusAtual);

        let html = '';

        FLUXO_PRINCIPAL.forEach((etapa, i) => {
            const isDone    = i < idxAtual || (statusAtual === etapa);
            const isCurrent = statusAtual === etapa;
            const isAfter   = i > idxAtual && !isRejeitado && !isCancelado;

            let dotClass = '';
            if (isCurrent && !isRejeitado && !isCancelado) dotClass = 'current';
            else if (isDone && !isCurrent) dotClass = 'done';

            const icon = isDone && !isCurrent ? '✓' : (i + 1);

            html += `
                <div class="flow-step">
                    <div class="flow-dot ${dotClass}">${icon}</div>
                    <div class="flow-label ${isCurrent ? 'active' : ''}">${LABELS[etapa]}</div>
                </div>`;

            if (i < FLUXO_PRINCIPAL.length - 1) {
                const lineClass = (i < idxAtual) ? 'done' : '';
                html += `<div class="flow-line ${lineClass}"></div>`;
            }
        });

        // estado lateral: Rejeitado ou Cancelado
        if (isRejeitado || isCancelado) {
            const cls = isRejeitado ? 'rejected' : 'cancelled';
            html += `
                <div class="flow-line"></div>
                <div class="flow-step">
                    <div class="flow-dot ${cls}">✕</div>
                    <div class="flow-label active">${LABELS[statusAtual]}</div>
                </div>`;
        }

        container.innerHTML = html;
    }

    function renderSelect() {
        const sel = document.getElementById('novoStatus');
        if (!sel) return;
        const opcoes = TRANSICOES[statusAtual] || [];
        sel.innerHTML = opcoes.map(o => `<option value="${o}">${LABELS[o]}</option>`).join('');
    }

    async function atualizarStatus(id) {
        const sel = document.getElementById('novoStatus');
        if (!sel) return;
        const novoStatus = sel.value;

        try {
            const res = await fetch(`/api/solicitacoes/${id}/status?novoStatus=${novoStatus}`, { method: 'PATCH' });
            const msg = await res.text();
            if (res.ok) {
                toast(msg, 'ok');
                setTimeout(() => location.reload(), 1200);
            } else {
                toast(msg || 'Erro ao atualizar status.', 'err');
            }
        } catch (e) {
            toast('Erro de conexão com o servidor.', 'err');
        }
    }

    function toast(msg, tipo) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'show ' + (tipo || '');
        setTimeout(() => el.className = '', 3000);
    }

    renderFluxo();
    renderSelect();
</script>
</body>
</html>
